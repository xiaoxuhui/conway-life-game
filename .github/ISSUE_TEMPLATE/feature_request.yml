name: 功能建议
description: 提议新的玩法、交互或工程改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不只是期望的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: compatibility
    attributes:
      label: 兼容性
      options:
        - label: 我已考虑离线 file:// 运行、零运行时依赖和现有存档兼容性。
