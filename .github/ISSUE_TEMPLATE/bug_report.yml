name: Bug 报告
description: 报告可复现的错误或回归
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢报告问题。请先确认问题可以在最新 main 或最新版本复现。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.15.0 或提交 SHA
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: 启动方式
      options:
        - 双击 index.html（file://）
        - 本地静态服务器
        - GitHub Pages
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      placeholder: Windows 11 / Chrome 版本号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请提供最小、连续的操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与控制台错误
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 这不是需要私密披露的安全漏洞；安全问题将按 SECURITY.md 报告。
          required: true
